<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f4;--card:#fff;--fg:#1a211e;--mu:#5d6863;--ln:#dde2df;--ac:#0e7c66;--ac-fg:#fff;--soft:#e8f3ef;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--card:#191e1c;--fg:#e5e9e7;--mu:#9ba6a1;--ln:#2b3430;--ac:#4fc3a5;--ac-fg:#0c1411;--soft:#1f2b27;--err:#f2b8b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111513;--card:#191e1c;--fg:#e5e9e7;--mu:#9ba6a1;--ln:#2b3430;--ac:#4fc3a5;--ac-fg:#0c1411;--soft:#1f2b27;--err:#f2b8b5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Noto Sans",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;margin:0 0 2px;font-weight:600}
.sub{color:var(--mu);margin:0 0 20px;font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--ln);border-radius:8px;padding:12px;
  background:var(--bg);color:var(--fg);font:17px/2.1 "Noto Sans","Noto Nastaliq Urdu",system-ui,sans-serif}
textarea:focus,button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.ex button{border:1px solid var(--ln);background:var(--bg);color:var(--mu);border-radius:99px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.ex button:hover{color:var(--fg);border-color:var(--mu)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px}
.speak{background:var(--ac);color:var(--ac-fg);border:0;border-radius:8px;padding:9px 22px;font-weight:600;font-size:15px;cursor:pointer}
.speak:disabled{opacity:.55;cursor:progress}
label{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:8px}
input[type=range]{accent-color:var(--ac);width:120px}
.hint{color:var(--mu);font-size:12px;margin-left:auto}
.out{margin-top:16px}
audio{width:100%;height:40px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mu);font-size:12.5px;margin:8px 0 0}
.stats b{color:var(--fg);font-weight:500}
details{margin-top:10px;font-size:13px;color:var(--mu)}
details summary{cursor:pointer}
.reads{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.reads li{background:var(--soft);border-radius:6px;padding:6px 10px}
.reads .src{color:var(--fg);font-family:"Noto Sans","Noto Nastaliq Urdu",sans-serif;line-height:2}
.reads .ph{font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.9;word-break:break-word}
.err{color:var(--err);margin-top:12px;font-size:14px}
h2{font-size:14px;color:var(--mu);font-weight:600;margin:26px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.hist{display:grid;gap:8px}
.hist .card{padding:10px 12px}
.hist p{margin:0 0 6px;font-size:13.5px;line-height:2;font-family:"Noto Sans","Noto Nastaliq Urdu",sans-serif;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
  animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
@media (max-width:520px){.hint{display:none}}
</style>
</head>
<body>
<main>
  <h1>Type and listen</h1>
  <p class="sub" id="model">Model: loading…</p>

  <div class="card">
    <textarea id="text" dir="auto" aria-label="Text to speak" placeholder="Type Urdu, English or both… e.g. MariEnergies کے CEO جناب Faheem Haider ہیں۔"></textarea>
    <div class="row">
      <button class="speak" id="go">Speak</button>
      <label>Speed <input type="range" id="speed" min="0.8" max="1.2" step="0.05" value="1"><span id="speedv">1.00×</span></label>
      <label>Take <input type="number" id="seed" value="1" min="1" max="999" style="width:64px;padding:4px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--fg)"></label>
      <span class="hint">Ctrl + Enter to speak</span>
    </div>
    <div class="out" id="out" hidden>
      <audio id="player" controls></audio>
      <div class="stats" id="stats"></div>
      <details><summary>What the model reads (after the text rules)</summary><ul class="reads" id="reads"></ul></details>
    </div>
    <div class="err" id="err" hidden></div>
  </div>

  <h2 id="histh" hidden>Earlier takes</h2>
  <div class="hist" id="hist"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("speed").oninput = () => $("speedv").textContent = Number($("speed").value).toFixed(2) + "×";
fetch("/api/info").then(r => r.json()).then(j => $("model").textContent = "Model: " + j.ckpt + "").catch(() => {});

let current = null;
async function speak() {
  const text = $("text").value.trim();
  if (!text) { $("text").focus(); return; }
  const go = $("go");
  go.disabled = true; go.innerHTML = '<span class="spin"></span>Speaking…';
  $("err").hidden = true;
  try {
    const r = await fetch("/api/speak", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, speed: Number($("speed").value), seed: Number($("seed").value) || 1})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    const bytes = Uint8Array.from(atob(j.audio), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], {type: "audio/wav"}));
    if (current) addHistory(current);
    current = {text, url, seconds: j.seconds};
    $("player").src = url; $("player").play().catch(() => {});
    $("stats").innerHTML = `<a href="${url}" download="speech.wav" style="color:var(--ac)">Download wav</a>`;
    $("reads").innerHTML = j.sentences.map((s, i) =>
      `<li><div class="src" dir="auto">${esc(s)}</div><div class="ph" dir="auto">${esc(j.reads[i] || "")}</div></li>`).join("");
    $("out").hidden = false;
  } catch (e) {
    $("err").textContent = "Could not speak: " + e.message; $("err").hidden = false;
  } finally {
    go.disabled = false; go.textContent = "Speak";
  }
}
function addHistory(t) {
  $("histh").hidden = false;
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `<p dir="auto">${esc(t.text)}</p><audio controls src="${t.url}" style="height:34px"></audio>`;
  $("hist").prepend(d);
}
$("go").onclick = speak;
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); speak(); } });
</script>
</body>
</html>
